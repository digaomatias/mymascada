# MyMascada API — Fly.io configuration
# Deploy: flyctl deploy --config deploy/fly/fly.api.toml --dockerfile src/Dockerfile.api
app = "mymascada-api"
primary_region = "syd"

[build]
  dockerfile = "src/Dockerfile.api"

[deploy]
  release_command = "/app/migrate.sh"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:5126"
  App__FrontendUrl = "https://app.mymascada.com"
  Cors__AllowedOrigins = "https://mymascada.com,https://www.mymascada.com,https://app.mymascada.com,https://mymascada-api.fly.dev"
  Jwt__Issuer = "https://mymascada.com"
  Jwt__Audience = "https://mymascada.com"
  BetaAccess__RequireInviteCode = "true"
  # Email via Resend HTTP API (https://resend.com).
  # Requires secret: fly secrets set Email__Resend__ApiKey=re_xxx
  # See docs/email-production-setup.md for full setup (API key + SPF/DKIM DNS).
  Email__Enabled = "true"
  Email__Provider = "resend"
  Email__DefaultFromEmail = "no-reply@mymascada.com"
  Email__DefaultFromName = "MyMascada"
  PasswordReset__FrontendResetUrl = "https://app.mymascada.com/auth/reset-password"
  EmailVerification__FrontendVerifyUrl = "https://app.mymascada.com/auth/verify-email"
  # Akahu bank sync via hosted OAuth. Setting both Akahu__AppIdToken and
  # Akahu__AppSecret is what flips BankProviderModeResolver from personal_tokens
  # to hosted_oauth — so both must be present or the OAuth flow stays disabled:
  #   fly secrets set Akahu__AppIdToken=app_token_xxx Akahu__AppSecret=xxx
  # OAuthBaseUrl points at Akahu's dev/sandbox environment (5-user cap).
  Akahu__Enabled = "true"
  Akahu__RedirectUri = "https://app.mymascada.com/settings/bank-connections/callback"
  Akahu__OAuthBaseUrl = "https://next.oauth.akahu.nz"

[http_service]
  internal_port = 5126
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[mounts]]
  source = "mymascada_data"
  destination = "/app/data"
