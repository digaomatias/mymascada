# =============================================================================
# MyMascada - Production stack on Mordor (self-hosted)
# =============================================================================
# Run by deploy/mordor/deploy.sh; see deploy/mordor/README.md for the runbook.
#
# Traffic: Cloudflare (proxied) -> home router :443 -> nginx-proxy-manager
# (server_default network) -> mymascada-web:3000 / mymascada-api:5126.
# No host ports are published; Postgres is only reachable on the internal network.
#
# Secrets live outside the repo, in /home/rodrigo/apps/mymascada on Mordor:
#   .env     -> compose interpolation (DB_PASSWORD)
#   api.env  -> API secrets (JWT, OAuth, Akahu, Resend, OpenAI, Firebase, ...)
# =============================================================================

name: mymascada

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: mymascada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mymascada
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: mymascada
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymascada -d mymascada"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  api:
    build:
      context: ../..
      dockerfile: src/Dockerfile.api
    image: mymascada-api:latest
    container_name: mymascada-api
    restart: unless-stopped
    env_file:
      - ${MYMASCADA_HOME:-/home/rodrigo/apps/mymascada}/api.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5126"
      ConnectionStrings__DefaultConnection: "Host=mymascada-postgres;Database=mymascada;Username=mymascada;Password=${DB_PASSWORD}"
      App__FrontendUrl: https://app.mymascada.com
      App__ApiBaseUrl: https://api.mymascada.com
      Cors__AllowedOrigins: https://app.mymascada.com
      Jwt__Issuer: https://mymascada.com
      Jwt__Audience: https://mymascada.com
      BetaAccess__RequireInviteCode: "true"
      Email__Enabled: "true"
      Email__Provider: resend
      Email__DefaultFromEmail: no-reply@mymascada.com
      Email__DefaultFromName: MyMascada
      PasswordReset__FrontendResetUrl: https://app.mymascada.com/auth/reset-password
      EmailVerification__FrontendVerifyUrl: https://app.mymascada.com/auth/verify-email
      # Akahu hosted OAuth: needs Akahu__AppIdToken + Akahu__AppSecret in api.env.
      # OAuthBaseUrl points at Akahu's dev/sandbox environment (5-user cap).
      Akahu__Enabled: "true"
      Akahu__RedirectUri: https://app.mymascada.com/settings/bank-connections/callback
      Akahu__OAuthBaseUrl: https://next.oauth.akahu.nz
      LLM__OpenAI__Model: gpt-4o-mini
    volumes:
      # Data Protection keys. Encrypted user settings (AI keys, bank tokens,
      # Telegram tokens) are unreadable without them - back this volume up.
      - api-data:/app/data
      - api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5126/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.mymascada.com
        INTERNAL_API_URL: http://mymascada-api:5126
    image: mymascada-web:latest
    container_name: mymascada-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.mymascada.com
      INTERNAL_API_URL: http://mymascada-api:5126
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # Daily pg_dump to /home/rodrigo/apps/mymascada/backups (7 daily, 4 weekly, 6 monthly)
  backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: mymascada-backup
    restart: unless-stopped
    volumes:
      - ${MYMASCADA_HOME:-/home/rodrigo/apps/mymascada}/backups:/backups
    environment:
      POSTGRES_HOST: mymascada-postgres
      POSTGRES_DB: mymascada
      POSTGRES_USER: mymascada
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Fc"
      BACKUP_SUFFIX: ".dump"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

networks:
  internal:
    driver: bridge
  # nginx-proxy-manager's network; it proxies to the containers by name.
  proxy:
    name: server_default
    external: true

volumes:
  pgdata:
    name: mymascada_pg17_data
  api-data:
    name: mymascada_api_data
  api-logs:
    name: mymascada_api_logs
